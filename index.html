<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ご注文</title>
  <style>
    :root {
      --line-green: #06C755;
      --text: #2b2b2b;
      --muted: #9aa0a6;
      --bg: #ffffff;
      --border: #ececec;
      --bubble-bg: #FFF6E0;
      --bubble-text: #8a6d1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #ededed;
        --muted: #8b9096;
        --bg: #1a1a1a;
        --border: #333;
        --bubble-bg: #3a3220;
        --bubble-text: #f0d98a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem 1.5rem;
      text-align: center;
    }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 1.2rem;
      border: 3px solid var(--border);
      border-top-color: var(--line-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }

    .bubble {
      position: relative;
      display: inline-block;
      background: var(--bubble-bg);
      color: var(--bubble-text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.6rem 1.1rem;
      border-radius: 999px;
      margin-bottom: 1.4rem;
      animation: pop 0.4s ease;
    }
    .bubble::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid var(--bubble-bg);
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 2.6rem;
      margin-bottom: 0.6rem;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.6;
      margin: 0 0 0.6rem;
    }
    p.lead {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--muted);
      margin: 0 0 1.8rem;
    }
    button.primary {
      display: block;
      width: 100%;
      border: none;
      background: var(--line-green);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      padding: 1rem 1.2rem;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(6, 199, 85, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }
    button.primary:active {
      transform: translateY(1px);
      box-shadow: 0 1px 5px rgba(6, 199, 85, 0.2);
    }
    a.secondary {
      display: inline-block;
      margin-top: 1.4rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .note {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.6;
      margin-top: 1rem;
    }
    .error {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.7;
    }
    .error code {
      display: block;
      margin-top: 0.8rem;
      font-size: 0.72rem;
      opacity: 0.6;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var mode = params.get('mode') || '';
    var script = document.createElement('script');
    script.src = (mode === 'exit') ? 'exit.js' : 'order.js';
    document.body.appendChild(script);
  </script>
</body>
</html>
