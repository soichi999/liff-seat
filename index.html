<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>座席注文</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem 1.2rem;
      color: #333;
    }
    #status {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: block;
      text-decoration: none;
      border-radius: 10px;
      margin: 0 auto;
    }
    .add-friend {
      background: #06C755;
      color: #fff;
      font-weight: bold;
      font-size: 1.05rem;
      padding: 1rem 1.5rem;
      max-width: 320px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .go-order {
      color: #999;
      font-size: 0.85rem;
      padding: 0.7rem;
      margin-top: 1.2rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <p id="status">確認中です…</p>
  <div id="content"></div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.26.1/sdk.js"></script>
  <script>
    const LIFF_ID = '2011234867-hoIMCFuA';
    const ADD_FRIEND_URL = 'https://line.me/R/ti/p/@251wgwtq';
    const LOOKUP_API = 'https://script.google.com/macros/s/AKfycby-A8FU2kQbCLLbgzBaBhdfz80S_9Bkirgj2rDhe5kvGo8AJysrIxs6wmcRqLil7GE/exec';

    const statusEl = document.getElementById('status');
    statusEl.textContent = 'JS開始OK';

    liff.init({ liffId: LIFF_ID }).then(function () {
      statusEl.textContent = 'LIFF init OK';

      var params = new URLSearchParams(location.search);
      var seat = params.get('seat') || '';
      statusEl.textContent = 'seat=' + seat;

      if (!liff.isLoggedIn()) { liff.login(); return; }

      if (!seat) {
        statusEl.textContent = '座席情報が見つかりません（URLにseatパラメータがありません）';
        return;
      }

      fetch(LOOKUP_API + '?action=lookup&seat=' + encodeURIComponent(seat))
        .then(function (res) { return res.json(); })
        .then(function (result) {
          var orderUrl = result.orderUrl;
          if (!orderUrl) {
            statusEl.textContent = '座席情報が見つかりません（seat=' + seat + '）';
            return;
          }

          liff.getFriendship().then(function (friendship) {
            if (friendship.friendFlag) {
              statusEl.textContent = '注文サイトへ移動します…';
              window.location.href = orderUrl;
            } else {
              statusEl.textContent = 'お得な情報をお届けします。\n友だち追加してご注文へお進みください。';
              document.getElementById('content').innerHTML =
                '<a class="btn add-friend" href="' + ADD_FRIEND_URL + '">友だち追加して注文に進む</a>' +
                '<a class="btn go-order" href="' + orderUrl + '">友だち追加せずに注文に進む</a>';

              // 友だち追加から戻ってきたら再チェックして自動遷移
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                  liff.getFriendship().then(function (f2) {
                    if (f2.friendFlag) {
                      statusEl.textContent = '友だち追加ありがとうございます。注文サイトへ移動します…';
                      window.location.href = orderUrl;
                    }
                  });
                }
              });
            }
          }).catch(function (err) {
            statusEl.textContent = 'friendshipエラー: ' + err.message;
          });
        }).catch(function (err) {
          statusEl.textContent = 'lookupエラー: ' + err.message;
        });
    }).catch(function (err) {
      statusEl.textContent = 'initエラー: ' + err.message;
    });
  </script>
</body>
</html>
