<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ご注文</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f2f7f3;
      --text: #3a4440;
      --text-h: #142018;
      --text-dim: #7d8a84;
      --border: #dfe9e2;
      --accent: #0a8f4c;
      --accent-dim: #e1f5e8;
      --card-bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181a;
        --bg-alt: #1c2320;
        --text: #d8ded9;
        --text-h: #f2f5f2;
        --text-dim: #8b9490;
        --border: #2b332e;
        --accent: #26c47a;
        --accent-dim: #163627;
        --card-bg: #1c2320;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 3rem 1.75rem;
      text-align: center;
      background: var(--card-bg);
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 1.2rem;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-h);
      line-height: 1.5;
      margin: 0 0 0.7rem;
      letter-spacing: 0.01em;
    }
    p.lead {
      font-size: 0.92rem;
      line-height: 1.85;
      color: var(--text-dim);
      margin: 0 0 2rem;
    }
    .bubble {
      position: relative;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem 1.3rem 1rem;
      margin-bottom: 1.9rem;
    }
    .bubble h1,
    .bubble p.lead {
      margin: 0;
    }
    .bubble h1 {
      margin-bottom: 0.5rem;
    }
    .bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -9px;
      width: 18px;
      height: 18px;
      background: var(--bg-alt);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transform: translateX(-50%) rotate(45deg);
      border-bottom-right-radius: 3px;
    }
    .note-box {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-top: 1.4rem;
    }
    .note-box .note {
      margin: 0;
    }
    button.primary,
    a.primary {
      display: block;
      width: 100%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      padding: 1rem 1.2rem;
      border-radius: 8px;
      letter-spacing: 0.02em;
      transition: opacity 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }
    button.primary:active,
    a.primary:active {
      transform: translateY(1px);
      opacity: 0.9;
    }
    a.secondary {
      display: inline-block;
      margin-top: 1.6rem;
      color: var(--text-dim);
      font-size: 0.8rem;
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
    }
    .note {
      font-size: 0.76rem;
      color: var(--text-dim);
      line-height: 1.8;
      margin-top: 1.4rem;
    }
    .error {
      font-size: 0.88rem;
      color: var(--text-dim);
      line-height: 1.8;
    }
    .error code {
      display: block;
      margin-top: 0.9rem;
      font-size: 0.72rem;
      opacity: 0.6;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var mode = params.get('mode') || '';
    var script = document.createElement('script');
    script.src = (mode === 'exit') ? 'exit.js' : 'order.js';
    document.body.appendChild(script);
  </script>
</body>
</html>
